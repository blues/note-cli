name: audit

on:
    push:
      branches: [ master ]
    pull_request:
      branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/master' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7

      -
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: |
            go.sum
            lib/go.sum

      -
        name: Verify dependencies
        run: |
          go mod verify
          go -C lib mod verify

      -
        name: Build
        run: go build -v ./...

      -
        name: Run go vet
        run: |
          go vet ./...
          go -C lib vet ./...

      -
        name: Run tests
        run: |
          go test ./...
          go -C lib test ./...
