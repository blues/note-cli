version: 2

env:
  - MACOSX_DEPLOYMENT_TARGET=15.0

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  -
    id: "notecard-linux"
    dir: notecard
    binary: notecard

    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm
      - arm64

  -
    id: "notehub-linux"
    dir: notehub
    binary: notehub

    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm
      - arm64
  -
    id: "notecard"
    dir: notecard
    binary: notecard

    env:
      - CGO_ENABLED=1
    goos:
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm
        goarm: 6
      - goos: windows
        goarch: arm64
    hooks: &macos-minos-check
      post:
        - cmd: >-
            sh -c 'case "$0" in darwin_*)
            minos=$(otool -l "$1" | awk "/LC_BUILD_VERSION/{f=1} f && /minos/{print \$2; exit}");
            echo "$1: minos $minos";
            test "$minos" = "$MACOSX_DEPLOYMENT_TARGET";;
            esac' "{{ .Target }}" "{{ .Path }}"
          output: true

  -
    id: "notehub"
    dir: notehub
    binary: notehub

    env:
      - CGO_ENABLED=1
    goos:
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm
        goarm: 6
      - goos: windows
        goarch: arm64
    hooks: *macos-minos-check

checksum:
  name_template: 'checksums.txt'
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

nfpms:
  -
    id: notecard_deb
    package_name: notecard
    ids:
     - notecard-linux
    vendor: Blues
    homepage: https://blues.com
    maintainer: Blues <support@blues.com>
    description: Notecard CLI
    license: MIT
    formats:
      - deb

  -
    id: notehub_deb
    package_name: notehub
    ids:
     - notehub-linux
    vendor: Blues
    homepage: https://blues.com
    maintainer: Blues <support@blues.com>
    description: Notehub CLI
    license: MIT
    formats:
      - deb

archives:
  - id: note-cli
    ids:
      - notecard
      - notehub
      - notecard-linux
      - notehub-linux

homebrew_casks:
  - ids:
      - note-cli
    binaries:
      - notecard
      - notehub
    repository:
      owner: blues
      name: homebrew-note-cli
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://blues.com
    description: Note CLI
    license: MIT
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/notecard"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/notehub"]
          end
